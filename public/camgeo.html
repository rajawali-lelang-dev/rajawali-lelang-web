<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoCam Ultra | Smart Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .glass { background: rgba(15,23,42,0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    .preview-overlay { background: rgba(10,10,10,0.92); border-left: 6px solid #facc15; min-height: 120px; }
    #canvas-output { display: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="p-4 border-b border-white/10 flex justify-between items-center glass sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="bg-yellow-400 text-black p-2 rounded-lg font-black text-xl">GC</div>
      <h1 class="font-bold tracking-tight hidden sm:block">GEOCAM <span class="text-yellow-400">ULTRA</span></h1>
    </div>
    <button onclick="document.getElementById('foto').click()" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-full text-sm font-semibold transition">
      Ganti Foto
    </button>
  </header>

  <main class="flex-1 flex flex-col md:flex-row overflow-hidden">

    <!-- PREVIEW -->
    <section class="flex-1 p-4 md:p-8 flex items-center justify-center bg-black/40 overflow-auto">
      <div class="relative shadow-2xl max-w-full">
        <img id="pv-img" src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=1000" class="max-h-[75vh] rounded-lg block">

        <!-- Preview overlay — identik dengan Canvas render -->
        <div class="absolute bottom-[5%] left-1/2 -translate-x-1/2 w-[45%] preview-overlay rounded-lg text-white pointer-events-none flex gap-5 p-4">
          <div class="w-[100px] h-[100px] bg-slate-800 rounded-sm overflow-hidden shrink-0 border-2 border-yellow-400">
            <img id="map-preview" src="" class="w-full h-full object-cover" onerror="this.style.display='none'">
          </div>
          <div class="w-1 bg-yellow-400 rounded self-stretch my-1 shrink-0"></div>
          <div class="flex-1 flex flex-col justify-center min-w-0">
            <div class="flex items-center gap-4">
              <span id="out-time" class="text-5xl font-black leading-none tracking-tighter shrink-0">00:00</span>
              <div class="flex flex-col">
                <span id="out-day" class="text-xs font-black text-yellow-400 leading-none">MONDAY</span>
                <span id="out-date" class="text-[11px] text-slate-400 font-bold mt-1">01 JAN 2026</span>
              </div>
            </div>
            <div id="out-loc" class="text-lg font-black text-yellow-400 truncate mt-2 leading-none">LOKASI ANDA</div>
            <div id="out-addr" class="text-[11px] opacity-90 line-clamp-2 leading-snug mt-1">Alamat lengkap akan muncul di sini...</div>
            <div class="text-[9px] font-mono opacity-40 mt-2">GPS: <span id="out-lat">0</span>, <span id="out-long">0</span></div>
          </div>
        </div>
      </div>
    </section>

    <!-- FORM PANEL -->
    <section class="w-full md:w-[420px] glass p-6 overflow-y-auto border-l border-white/10">
      <div class="space-y-5">
        <input type="file" id="foto" class="hidden" accept="image/jpeg,image/png" onchange="loadImg(this)">
        <h2 class="text-xl font-bold">Editor Data</h2>

        <div class="grid grid-cols-2 gap-3">
          <div class="space-y-1">
            <label class="text-[10px] font-bold text-slate-500 uppercase">Waktu</label>
            <input type="text" id="waktu" oninput="sync()" class="w-full bg-slate-800 border border-white/10 rounded-lg p-2.5 text-sm outline-none focus:ring-1 ring-yellow-400">
          </div>
          <div class="space-y-1">
            <label class="text-[10px] font-bold text-slate-500 uppercase">Hari</label>
            <input type="text" id="hari" oninput="sync()" class="w-full bg-slate-800 border border-white/10 rounded-lg p-2.5 text-sm outline-none focus:ring-1 ring-yellow-400">
          </div>
        </div>

        <div class="space-y-1">
          <label class="text-[10px] font-bold text-slate-500 uppercase">Tanggal</label>
          <input type="text" id="tanggal" oninput="sync()" class="w-full bg-slate-800 border border-white/10 rounded-lg p-2.5 text-sm outline-none focus:ring-1 ring-yellow-400">
        </div>

        <div class="space-y-1">
          <label class="text-[10px] font-bold text-slate-500 uppercase">Kota / Provinsi</label>
          <input type="text" id="kota" oninput="sync()" class="w-full bg-slate-800 border border-white/10 rounded-lg p-2.5 text-sm outline-none focus:ring-1 ring-yellow-400">
        </div>

        <div class="space-y-1">
          <label class="text-[10px] font-bold text-slate-500 uppercase">Alamat Lengkap</label>
          <textarea id="alamat" oninput="sync()" class="w-full bg-slate-800 border border-white/10 rounded-lg p-2.5 text-sm h-24 resize-none outline-none focus:ring-1 ring-yellow-400"></textarea>
        </div>

        <div class="flex gap-2">
          <div class="flex-1">
            <label class="text-[10px] text-slate-500 uppercase">LAT</label>
            <input type="text" id="lat" oninput="sync()" class="w-full bg-slate-800 border border-white/10 p-2 rounded text-xs outline-none focus:ring-1 ring-yellow-400">
          </div>
          <div class="flex-1">
            <label class="text-[10px] text-slate-500 uppercase">LONG</label>
            <input type="text" id="long" oninput="sync()" class="w-full bg-slate-800 border border-white/10 p-2 rounded text-xs outline-none focus:ring-1 ring-yellow-400">
          </div>
          <button onclick="getGPS()" title="Ambil GPS" class="self-end p-2.5 bg-blue-600 hover:bg-blue-500 rounded-lg transition text-lg">📡</button>
        </div>

        <button onclick="generateAndDownload()" class="w-full bg-yellow-400 hover:bg-yellow-300 text-black font-extrabold py-4 rounded-xl shadow-lg shadow-yellow-400/20 active:scale-95 transition-all text-lg uppercase">
          Generate & Download Foto
        </button>
        <div id="progress" class="hidden text-center text-sm text-yellow-400 animate-pulse">⚙️ Memproses foto...</div>
      </div>
    </section>
  </main>

  <!-- MODAL HASIL -->
  <div id="modal-hasil" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
    <div class="glass max-w-lg w-full rounded-3xl p-6 text-center border border-yellow-400/40">
      <h3 class="text-2xl font-bold mb-4 text-yellow-400">✓ Hasil Generate</h3>
      <img id="hasil-img" class="w-full rounded-xl mb-6 shadow-2xl" alt="Hasil GeoCam">
      <div class="flex gap-3">
        <button onclick="downloadHasil()" class="flex-1 bg-white text-black font-bold py-3 rounded-xl hover:bg-yellow-300 transition">⬇ Download</button>
        <button onclick="document.getElementById('modal-hasil').classList.add('hidden')" class="flex-1 bg-slate-800 font-bold py-3 rounded-xl hover:bg-slate-700 transition">✕ Tutup</button>
      </div>
    </div>
  </div>

  <canvas id="canvas-output"></canvas>

  <script>
    let currentPhotoSrc = null;
    let hasilDataUrl    = null;

    function sync() {
      document.getElementById('out-time').innerText = document.getElementById('waktu').value   || '00:00';
      document.getElementById('out-date').innerText = document.getElementById('tanggal').value || '';
      document.getElementById('out-day').innerText  = (document.getElementById('hari').value   || '').toUpperCase();
      document.getElementById('out-loc').innerText  = (document.getElementById('kota').value   || 'LOKASI').toUpperCase();
      document.getElementById('out-addr').innerText = document.getElementById('alamat').value  || 'Alamat...';
      document.getElementById('out-lat').innerText  = document.getElementById('lat').value     || '0';
      document.getElementById('out-long').innerText = document.getElementById('long').value    || '0';
      const lat = document.getElementById('lat').value;
      const lon = document.getElementById('long').value;
      if (lat && lon) {
        document.getElementById('map-preview').src =
          `https://static-maps.yandex.ru/1.x/?ll=${lon},${lat}&z=15&l=map&size=200,200&lang=en_US&pt=${lon},${lat},pm2rdm`;
      }
    }

    function loadImg(input) {
      if (!input.files || !input.files[0]) return;
      const reader = new FileReader();
      reader.onload = e => { currentPhotoSrc = e.target.result; document.getElementById('pv-img').src = e.target.result; };
      reader.readAsDataURL(input.files[0]);
    }

    async function getGPS() {
      if (!navigator.geolocation) { alert('Geolocation tidak didukung.'); return; }
      navigator.geolocation.getCurrentPosition(async pos => {
        const { latitude: lat, longitude: lon } = pos.coords;
        document.getElementById('lat').value  = lat.toFixed(6);
        document.getElementById('long').value = lon.toFixed(6);
        try {
          const res  = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
          const data = await res.json();
          const addr = data.address;
          document.getElementById('kota').value   = (addr.city || addr.town || addr.state || '').toUpperCase() + ', INDONESIA';
          document.getElementById('alamat').value = data.display_name;
        } catch(e) {}
        sync();
      }, () => alert('Gagal mendapatkan lokasi GPS.'));
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload  = () => resolve(img);
        img.onerror = () => reject(new Error('Gagal load: ' + src));
        img.src = src;
      });
    }

    function wrapText(ctx, text, maxWidth) {
      const words = text.split(' ');
      const lines = [];
      let line = '';
      for (const word of words) {
        const test = line ? line + ' ' + word : word;
        if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = word; }
        else { line = test; }
      }
      if (line) lines.push(line);
      return lines;
    }

    async function generateAndDownload() {
      if (!currentPhotoSrc) { alert('Pilih foto terlebih dahulu!'); return; }
      document.getElementById('progress').classList.remove('hidden');

      const waktu  = document.getElementById('waktu').value   || '00:00';
      const tanggal= document.getElementById('tanggal').value || '';
      const hari   = (document.getElementById('hari').value   || '').toUpperCase();
      const kota   = (document.getElementById('kota').value   || '').toUpperCase();
      const alamat = document.getElementById('alamat').value  || '';
      const lat    = parseFloat(document.getElementById('lat').value)  || 0;
      const lon    = parseFloat(document.getElementById('long').value) || 0;

      try {
        const photoImg = await loadImage(currentPhotoSrc);
        const sw = photoImg.naturalWidth;
        const sh = photoImg.naturalHeight;

        const canvas  = document.getElementById('canvas-output');
        canvas.width  = sw; canvas.height = sh;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(photoImg, 0, 0, sw, sh);

        // Dimensi — sinkron dengan PHP
        const scale   = sw / 1920.0;
        const boxW    = Math.round(sw * 0.45);
        const boxH    = Math.max(180, Math.round(220 * scale));
        const mapSize = Math.round(boxH * 0.88);
        const mapPad  = Math.round(12 * scale);
        const destX   = Math.round((sw - boxW) / 2);
        const destY   = Math.max(0, Math.round(sh - boxH - sh * 0.05));

        // Background box
        ctx.save();
        ctx.fillStyle = 'rgba(10,10,10,0.92)';
        ctx.beginPath();
        ctx.roundRect(destX, destY, boxW, boxH, 6);
        ctx.fill();

        // Border kiri kuning
        ctx.fillStyle = '#facc15';
        ctx.fillRect(destX, destY, 6, boxH);

        // Map
        let textStartX = destX + mapPad + 6;
        try {
          const mapUrl = `https://static-maps.yandex.ru/1.x/?ll=${lon},${lat}&z=15&l=map&size=300,300&lang=en_US&pt=${lon},${lat},pm2rdm`;
          const mapImg = await loadImage(mapUrl);
          const mapX   = destX + mapPad + 6;
          const mapY   = destY + Math.round((boxH - mapSize) / 2);
          ctx.drawImage(mapImg, mapX, mapY, mapSize, mapSize);
          ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2;
          ctx.strokeRect(mapX, mapY, mapSize, mapSize);
          textStartX = mapX + mapSize + Math.round(30 * scale);
        } catch {
          const mapX = destX + mapPad + 6;
          const mapY = destY + Math.round((boxH - mapSize) / 2);
          ctx.fillStyle = '#3c3c3c'; ctx.fillRect(mapX, mapY, mapSize, mapSize);
          ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2; ctx.strokeRect(mapX, mapY, mapSize, mapSize);
          const cx = mapX + mapSize/2, cy = mapY + mapSize/2;
          ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(cx, cy-10, 12, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#3c3c3c'; ctx.beginPath(); ctx.arc(cx, cy-10, 5, 0, Math.PI*2); ctx.fill();
          ctx.strokeStyle = '#facc15'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(cx, cy+2); ctx.lineTo(cx, cy+18); ctx.stroke();
          textStartX = mapX + mapSize + Math.round(30 * scale);
        }

        // Garis vertikal kuning
        const lineX = textStartX - Math.round(15 * scale);
        ctx.fillStyle = '#facc15';
        ctx.fillRect(lineX, destY + Math.round(25*scale), Math.round(3*scale), boxH - Math.round(50*scale));

        // Font sizes — sinkron dengan PHP
        const fsTime   = Math.max(28, Math.round(65 * scale));
        const fsHari   = Math.max(11, Math.round(14 * scale));
        const fsDate   = Math.max(10, Math.round(13 * scale));
        const fsKota   = Math.max(14, Math.round(22 * scale));
        const fsAlamat = Math.max(10, Math.round(13 * scale));
        const fsGps    = Math.max(8,  Math.round(10 * scale));

        // Waktu
        ctx.fillStyle = '#ffffff';
        ctx.font = `900 ${fsTime}px 'Inter', sans-serif`;
        ctx.fillText(waktu, textStartX, destY + Math.round(85 * scale));

        // Hari & Tanggal di kanan waktu
        const timeW = ctx.measureText(waktu).width;
        const dateX = textStartX + timeW + Math.round(20 * scale);
        ctx.fillStyle = '#facc15';
        ctx.font = `800 ${fsHari}px 'Inter', sans-serif`;
        ctx.fillText(hari, dateX, destY + Math.round(55 * scale));
        ctx.fillStyle = '#bebebe';
        ctx.font = `400 ${fsDate}px 'Inter', sans-serif`;
        ctx.fillText(tanggal, dateX, destY + Math.round(82 * scale));

        // Kota
        ctx.fillStyle = '#facc15';
        ctx.font = `800 ${fsKota}px 'Inter', sans-serif`;
        ctx.fillText(kota, textStartX, destY + Math.round(130 * scale));

        // Alamat
        ctx.fillStyle = '#ffffff';
        ctx.font = `400 ${fsAlamat}px 'Inter', sans-serif`;
        const addrLines = wrapText(ctx, alamat, boxW - (textStartX - destX) - mapPad);
        let lineY = destY + Math.round(160 * scale);
        addrLines.slice(0, 2).forEach(line => {
          ctx.fillText(line, textStartX, lineY);
          lineY += Math.round(22 * scale);
        });

        // GPS
        ctx.fillStyle = '#bebebe';
        ctx.font = `400 ${fsGps}px 'Inter', sans-serif`;
        ctx.fillText(`Lat ${lat.toFixed(6)}, Long ${lon.toFixed(6)}`, textStartX, destY + boxH - Math.round(15 * scale));

        ctx.restore();

        hasilDataUrl = canvas.toDataURL('image/jpeg', 0.95);
        document.getElementById('hasil-img').src = hasilDataUrl;
        document.getElementById('modal-hasil').classList.remove('hidden');

      } catch(err) {
        alert('Error: ' + err.message);
        console.error(err);
      } finally {
        document.getElementById('progress').classList.add('hidden');
      }
    }

    function downloadHasil() {
      if (!hasilDataUrl) return;
      const a = document.createElement('a');
      a.href = hasilDataUrl;
      a.download = 'GeoCam_' + Date.now() + '.jpg';
      a.click();
    }

    window.onload = () => {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      document.getElementById('waktu').value   = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
      document.getElementById('tanggal').value = now.toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'}).toUpperCase();
      document.getElementById('hari').value    = now.toLocaleDateString('id-ID', {weekday:'long'}).toUpperCase();
      document.getElementById('kota').value    = 'SURABAYA, JAWA TIMUR';
      document.getElementById('alamat').value  = 'Jl. Raya Gubeng No. 1, Surabaya, Jawa Timur';
      document.getElementById('lat').value     = '-7.257500';
      document.getElementById('long').value    = '112.752100';
      sync();
    };
  </script>
</body>
</html>
