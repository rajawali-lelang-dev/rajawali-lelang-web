<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoCam Ultra | Smart Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .glass { background: rgba(15,23,42,0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    #canvas-output { display: none; }

    /* ── LIVE PREVIEW OVERLAY ─────────────────────────────── */
    #preview-wrap {
      position: relative;
      display: inline-block;
      max-width: 100%;
    }
    #pv-img {
      display: block;
      max-height: 72vh;
      max-width: 100%;
      border-radius: 8px;
    }
    /* Geotag bar — bottom, full width of image */
    #pv-bar {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      background: rgba(10,10,10,0.62);
      border-top: 4px solid #facc15;
      border-radius: 0 0 8px 8px;
      display: flex;
      align-items: stretch;
      gap: 0;
      padding: 10px 14px;
      box-sizing: border-box;
    }
    #pv-map-box {
      width: 80px;
      height: 80px;
      background: #1e293b;
      border: 2px solid #facc15;
      border-radius: 4px;
      overflow: hidden;
      flex-shrink: 0;
    }
    #pv-map-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #pv-divider {
      width: 3px;
      background: #facc15;
      margin: 0 12px;
      border-radius: 2px;
      align-self: stretch;
      flex-shrink: 0;
    }
    #pv-text { flex: 1; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
    #pv-row1 { display: flex; align-items: baseline; gap: 14px; flex-wrap: nowrap; }
    #out-time { font-size: 2.6rem; font-weight: 900; color: #fff; line-height: 1; white-space: nowrap; }
    #pv-dateblock { display: flex; flex-direction: column; }
    #out-day  { font-size: 0.75rem; font-weight: 800; color: #facc15; line-height: 1; }
    #out-date { font-size: 0.65rem; color: #94a3b8; font-weight: 600; margin-top: 2px; }
    #out-loc  { font-size: 0.95rem; font-weight: 800; color: #facc15; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #out-addr { font-size: 0.65rem; color: #e2e8f0; opacity: 0.85; margin-top: 2px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.4; }
    #out-gps  { font-size: 0.55rem; font-family: monospace; color: #64748b; margin-top: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="p-4 border-b border-white/10 flex justify-between items-center glass sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="bg-yellow-400 text-black p-2 rounded-lg font-black text-xl">GC</div>
      <h1 class="font-bold tracking-tight hidden sm:block">GEOCAM <span class="text-yellow-400">ULTRA</span></h1>
    </div>
    <button onclick="document.getElementById('foto').click()" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-full text-sm font-semibold transition">
      Ganti Foto
    </button>
  </header>

  <main class="flex-1 flex flex-col md:flex-row overflow-hidden">

    <!-- PREVIEW -->
    <section class="flex-1 p-4 md:p-8 flex items-center justify-center bg-black/40 overflow-auto">
      <div id="preview-wrap">
        <img id="pv-img" src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=1000" alt="preview">
        <div id="pv-bar">
          <div id="pv-map-box">
            <img id="map-preview" src="" alt="map" onerror="this.style.display='none'">
          </div>
          <div id="pv-divider"></div>
          <div id="pv-text">
            <div id="pv-row1">
              <span id="out-time">00:00</span>
              <div id="pv-dateblock">
                <span id="out-day">SENIN</span>
                <span id="out-date">01 JAN 2026</span>
              </div>
            </div>
            <div id="out-loc">LOKASI ANDA</div>
            <div id="out-addr">Alamat lengkap akan muncul di sini...</div>
            <div id="out-gps">GPS: <span id="out-lat">0</span>, <span id="out-long">0</span></div>
          </div>
        </div>
      </div>
    </section>

    <!-- FORM PANEL -->
    <section class="w-full md:w-[420px] glass p-6 overflow-y-auto border-l border-white/10">
      <div class="space-y-5">
        <input type="file" id="foto" class="hidden" accept="image/jpeg,image/png" onchange="loadImg(this)">
        <h2 class="text-xl font-bold">Editor Data</h2>

        <div class="grid grid-cols-2 gap-3">
          <div class="space-y-1">
            <label class="text-[10px] font-bold text-slate-500 uppercase">Waktu</label>
            <input type="text" id="waktu" oninput="sync()" class="w-full bg-slate-800 border border-white/10 rounded-lg p-2.5 text-sm outline-none focus:ring-1 ring-yellow-400">
          </div>
          <div class="space-y-1">
            <label class="text-[10px] font-bold text-slate-500 uppercase">Hari</label>
            <input type="text" id="hari" oninput="sync()" class="w-full bg-slate-800 border border-white/10 rounded-lg p-2.5 text-sm outline-none focus:ring-1 ring-yellow-400">
          </div>
        </div>

        <div class="space-y-1">
          <label class="text-[10px] font-bold text-slate-500 uppercase">Tanggal</label>
          <input type="text" id="tanggal" oninput="sync()" class="w-full bg-slate-800 border border-white/10 rounded-lg p-2.5 text-sm outline-none focus:ring-1 ring-yellow-400">
        </div>

        <div class="space-y-1">
          <label class="text-[10px] font-bold text-slate-500 uppercase">Kota / Provinsi</label>
          <input type="text" id="kota" oninput="sync()" class="w-full bg-slate-800 border border-white/10 rounded-lg p-2.5 text-sm outline-none focus:ring-1 ring-yellow-400">
        </div>

        <div class="space-y-1">
          <label class="text-[10px] font-bold text-slate-500 uppercase">Alamat Lengkap</label>
          <textarea id="alamat" oninput="sync()" class="w-full bg-slate-800 border border-white/10 rounded-lg p-2.5 text-sm h-24 resize-none outline-none focus:ring-1 ring-yellow-400"></textarea>
        </div>

        <div class="flex gap-2">
          <div class="flex-1">
            <label class="text-[10px] text-slate-500 uppercase">LAT</label>
            <input type="text" id="lat" oninput="sync()" class="w-full bg-slate-800 border border-white/10 p-2 rounded text-xs outline-none focus:ring-1 ring-yellow-400">
          </div>
          <div class="flex-1">
            <label class="text-[10px] text-slate-500 uppercase">LONG</label>
            <input type="text" id="long" oninput="sync()" class="w-full bg-slate-800 border border-white/10 p-2 rounded text-xs outline-none focus:ring-1 ring-yellow-400">
          </div>
          <button onclick="getGPS()" title="Ambil GPS" class="self-end p-2.5 bg-blue-600 hover:bg-blue-500 rounded-lg transition text-lg">📡</button>
        </div>

        <button onclick="generateAndDownload()" class="w-full bg-yellow-400 hover:bg-yellow-300 text-black font-extrabold py-4 rounded-xl shadow-lg shadow-yellow-400/20 active:scale-95 transition-all text-lg uppercase">
          Generate &amp; Download Foto
        </button>
        <div id="progress" class="hidden text-center text-sm text-yellow-400 animate-pulse">⚙️ Memproses foto...</div>
      </div>
    </section>
  </main>

  <!-- MODAL HASIL -->
  <div id="modal-hasil" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
    <div class="glass max-w-lg w-full rounded-3xl p-6 text-center border border-yellow-400/40">
      <h3 class="text-2xl font-bold mb-4 text-yellow-400">✓ Hasil Generate</h3>
      <img id="hasil-img" class="w-full rounded-xl mb-6 shadow-2xl" alt="Hasil GeoCam">
      <div class="flex gap-3">
        <button onclick="downloadHasil()" class="flex-1 bg-white text-black font-bold py-3 rounded-xl hover:bg-yellow-300 transition">⬇ Download</button>
        <button onclick="document.getElementById('modal-hasil').classList.add('hidden')" class="flex-1 bg-slate-800 font-bold py-3 rounded-xl hover:bg-slate-700 transition">✕ Tutup</button>
      </div>
    </div>
  </div>

  <canvas id="canvas-output"></canvas>

  <script>
    let currentPhotoSrc = null;
    let hasilDataUrl    = null;

    function sync() {
      document.getElementById('out-time').innerText  = document.getElementById('waktu').value   || '00:00';
      document.getElementById('out-date').innerText  = document.getElementById('tanggal').value || '';
      document.getElementById('out-day').innerText   = (document.getElementById('hari').value   || '').toUpperCase();
      document.getElementById('out-loc').innerText   = (document.getElementById('kota').value   || 'LOKASI').toUpperCase();
      document.getElementById('out-addr').innerText  = document.getElementById('alamat').value  || 'Alamat...';
      document.getElementById('out-lat').innerText   = document.getElementById('lat').value     || '0';
      document.getElementById('out-long').innerText  = document.getElementById('long').value    || '0';

      const lat = document.getElementById('lat').value;
      const lon = document.getElementById('long').value;
      if (lat && lon) {
        const mapImg = document.getElementById('map-preview');
        mapImg.style.display = '';
        mapImg.src = `https://static-maps.yandex.ru/1.x/?ll=${lon},${lat}&z=15&l=map&size=200,200&lang=en_US&pt=${lon},${lat},pm2rdm`;
      }
    }

    function loadImg(input) {
      if (!input.files || !input.files[0]) return;
      const reader = new FileReader();
      reader.onload = e => {
        currentPhotoSrc = e.target.result;
        document.getElementById('pv-img').src = e.target.result;
      };
      reader.readAsDataURL(input.files[0]);
    }

    async function getGPS() {
      if (!navigator.geolocation) { alert('Geolocation tidak didukung.'); return; }
      navigator.geolocation.getCurrentPosition(async pos => {
        const { latitude: lat, longitude: lon } = pos.coords;
        document.getElementById('lat').value  = lat.toFixed(6);
        document.getElementById('long').value = lon.toFixed(6);
        try {
          const res  = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
          const data = await res.json();
          const addr = data.address;
          document.getElementById('kota').value   = (addr.city || addr.town || addr.state || '').toUpperCase() + ', INDONESIA';
          document.getElementById('alamat').value = data.display_name;
        } catch(e) {}
        sync();
      }, () => alert('Gagal mendapatkan lokasi GPS.'));
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload  = () => resolve(img);
        img.onerror = () => reject(new Error('Gagal load: ' + src));
        img.src = src;
      });
    }

    function wrapText(ctx, text, maxWidth) {
      const words = text.split(' ');
      const lines = [];
      let line = '';
      for (const word of words) {
        const test = line ? line + ' ' + word : word;
        if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = word; }
        else { line = test; }
      }
      if (line) lines.push(line);
      return lines;
    }

    async function generateAndDownload() {
      if (!currentPhotoSrc) { alert('Pilih foto terlebih dahulu!'); return; }
      document.getElementById('progress').classList.remove('hidden');

      const waktu   = document.getElementById('waktu').value   || '00:00';
      const tanggal = document.getElementById('tanggal').value || '';
      const hari    = (document.getElementById('hari').value   || '').toUpperCase();
      const kota    = (document.getElementById('kota').value   || '').toUpperCase();
      const alamat  = document.getElementById('alamat').value  || '';
      const lat     = parseFloat(document.getElementById('lat').value)  || 0;
      const lon     = parseFloat(document.getElementById('long').value) || 0;

      try {
        const photoImg = await loadImage(currentPhotoSrc);
        const sw = photoImg.naturalWidth;
        const sh = photoImg.naturalHeight;

        const canvas = document.getElementById('canvas-output');
        canvas.width  = sw;
        canvas.height = sh;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(photoImg, 0, 0, sw, sh);

        // ── Dimensi geotag bar ─────────────────────────────────────────────
        // Bar memenuhi lebar penuh foto, posisi di bagian bawah
        const scale    = sw / 1600.0;                          // referensi 1600px
        const padH     = Math.round(20 * scale);               // padding horizontal
        const padV     = Math.round(16 * scale);               // padding vertikal
        const mapSize  = Math.round(140 * scale);              // ukuran kotak peta
        const barH     = mapSize + padV * 2;                   // tinggi bar
        const divW     = Math.max(3, Math.round(4 * scale));   // lebar divider kuning
        const divGap   = Math.round(20 * scale);               // gap kiri-kanan divider
        const topBdr   = Math.max(4, Math.round(5 * scale));   // border atas kuning
        const barY     = sh - barH - Math.round(sh * 0.03);   // posisi Y bar
        const barX     = 0;
        const barW     = sw;

        // ── Background semi-transparan ─────────────────────────────────────
        ctx.save();
        ctx.fillStyle = 'rgba(10,10,10,0.58)';                 // transparan (bukan solid hitam)
        ctx.fillRect(barX, barY, barW, barH);

        // Border atas kuning
        ctx.fillStyle = '#facc15';
        ctx.fillRect(barX, barY, barW, topBdr);

        // ── Kotak peta ─────────────────────────────────────────────────────
        const mapX = barX + padH;
        const mapY = barY + padV;
        let textStartX = mapX + mapSize + divGap + divW + divGap;

        try {
          const mapUrl = `https://static-maps.yandex.ru/1.x/?ll=${lon},${lat}&z=15&l=map&size=400,400&lang=en_US&pt=${lon},${lat},pm2rdm`;
          const mapImg = await loadImage(mapUrl);
          ctx.drawImage(mapImg, mapX, mapY, mapSize, mapSize);
          ctx.strokeStyle = '#facc15';
          ctx.lineWidth   = Math.max(2, Math.round(2 * scale));
          ctx.strokeRect(mapX, mapY, mapSize, mapSize);
        } catch {
          // Placeholder map
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(mapX, mapY, mapSize, mapSize);
          ctx.strokeStyle = '#facc15';
          ctx.lineWidth = 2;
          ctx.strokeRect(mapX, mapY, mapSize, mapSize);
          const cx = mapX + mapSize/2, cy = mapY + mapSize/2;
          ctx.fillStyle = '#facc15';
          ctx.beginPath(); ctx.arc(cx, cy - mapSize*0.12, mapSize*0.12, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#1e293b';
          ctx.beginPath(); ctx.arc(cx, cy - mapSize*0.12, mapSize*0.05, 0, Math.PI*2); ctx.fill();
          ctx.strokeStyle = '#facc15'; ctx.lineWidth = Math.round(3*scale);
          ctx.beginPath(); ctx.moveTo(cx, cy - mapSize*0.01); ctx.lineTo(cx, cy + mapSize*0.18); ctx.stroke();
        }

        // ── Divider kuning vertikal ────────────────────────────────────────
        const lineX = mapX + mapSize + divGap;
        const lineY1 = barY + padV;
        const lineY2 = barY + barH - padV;
        ctx.fillStyle = '#facc15';
        ctx.fillRect(lineX, lineY1, divW, lineY2 - lineY1);

        // ── Font sizes skalabel ────────────────────────────────────────────
        const fsTime   = Math.max(36, Math.round(78 * scale));
        const fsHari   = Math.max(13, Math.round(18 * scale));
        const fsDate   = Math.max(11, Math.round(15 * scale));
        const fsKota   = Math.max(16, Math.round(26 * scale));
        const fsAlamat = Math.max(11, Math.round(16 * scale));
        const fsGps    = Math.max(9,  Math.round(12 * scale));
        const lh       = Math.round(24 * scale);               // line height alamat

        // ── Waktu (jam) ────────────────────────────────────────────────────
        const textY0 = barY + padV + Math.round(fsTime * 0.9);
        ctx.fillStyle = '#ffffff';
        ctx.font = `900 ${fsTime}px 'Inter', Arial, sans-serif`;
        ctx.fillText(waktu, textStartX, textY0);

        // ── Hari & Tanggal di kanan jam ────────────────────────────────────
        const timeW = ctx.measureText(waktu).width;
        const dateX = textStartX + timeW + Math.round(18 * scale);
        ctx.fillStyle = '#facc15';
        ctx.font = `800 ${fsHari}px 'Inter', Arial, sans-serif`;
        ctx.fillText(hari, dateX, textY0 - Math.round(fsTime * 0.42));
        ctx.fillStyle = '#94a3b8';
        ctx.font = `600 ${fsDate}px 'Inter', Arial, sans-serif`;
        ctx.fillText(tanggal, dateX, textY0 - Math.round(fsTime * 0.42) + fsHari + Math.round(4*scale));

        // ── Kota ──────────────────────────────────────────────────────────
        const kotaY = textY0 + Math.round(fsKota * 1.4);
        ctx.fillStyle = '#facc15';
        ctx.font = `800 ${fsKota}px 'Inter', Arial, sans-serif`;
        ctx.fillText(kota, textStartX, kotaY);

        // ── Alamat (wrap) ──────────────────────────────────────────────────
        const maxAddrW = barW - textStartX - padH;
        ctx.fillStyle = '#f1f5f9';
        ctx.font = `400 ${fsAlamat}px 'Inter', Arial, sans-serif`;
        const addrLines = wrapText(ctx, alamat, maxAddrW);
        let addrY = kotaY + Math.round(fsAlamat * 1.6);
        addrLines.slice(0, 2).forEach(line => {
          ctx.fillText(line, textStartX, addrY);
          addrY += lh;
        });

        // ── GPS koordinat ──────────────────────────────────────────────────
        ctx.fillStyle = '#64748b';
        ctx.font = `400 ${fsGps}px 'Inter', Arial, sans-serif`;
        ctx.fillText(`Lat ${lat.toFixed(6)}, Long ${lon.toFixed(6)}`, textStartX, barY + barH - Math.round(10 * scale));

        ctx.restore();

        hasilDataUrl = canvas.toDataURL('image/jpeg', 0.95);
        document.getElementById('hasil-img').src = hasilDataUrl;
        document.getElementById('modal-hasil').classList.remove('hidden');

      } catch(err) {
        alert('Error: ' + err.message);
        console.error(err);
      } finally {
        document.getElementById('progress').classList.add('hidden');
      }
    }

    function downloadHasil() {
      if (!hasilDataUrl) return;
      const a = document.createElement('a');
      a.href     = hasilDataUrl;
      a.download = 'GeoCam_' + Date.now() + '.jpg';
      a.click();
    }

    window.onload = () => {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      document.getElementById('waktu').value   = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
      document.getElementById('tanggal').value = now.toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'}).toUpperCase();
      document.getElementById('hari').value    = now.toLocaleDateString('id-ID', {weekday:'long'}).toUpperCase();
      document.getElementById('kota').value    = 'SURABAYA, JAWA TIMUR, INDONESIA';
      document.getElementById('alamat').value  = 'Jl. Raya Gubeng No. 1, Surabaya, Jawa Timur';
      document.getElementById('lat').value     = '-7.257500';
      document.getElementById('long').value    = '112.752100';
      sync();
    };
  </script>
</body>
</html>
